# 용어 사전. 모든 호가 같이 쓴다.
# 본문에서 [[용어]] 또는 [[용어|화면에 보일 글자]] 로 쓰면 밑줄이 생기고 설명이 뜬다.
# 사전에 없는 용어를 [[ ]] 로 감싸면 빌드가 실패한다. 새 용어는 여기에 먼저 추가하세요.
#
# 작성 규칙
# - tags: 분야 1~3개. 쓸 수 있는 태그는 src/lib/glossary.mjs 의 TAGS 에 있어요.
# - def: 처음 보는 사람이 이해할 수 있게 1~2문장. 다른 용어를 쓰면 그 용어도 사전에 있어야 해요.
# - 가나다순 정렬은 안 해도 돼요. 화면에서 정렬해요.

- id: 서버
  tags: [서버, 백엔드]
  en: Server
  def: 요청을 받아서 처리하고 결과를 돌려주는 컴퓨터(또는 프로그램)예요. 티켓 예매 사이트 뒤에서 좌석을 확인하고 결제를 처리하는 쪽이에요.

- id: 요청
  tags: [네트워크, 백엔드]
  en: Request
  def: 사용자의 브라우저나 앱이 서버에 "이거 해주세요"라고 보내는 메시지예요. 새로고침 한 번, 버튼 클릭 한 번이 각각 요청이 돼요.

- id: 스레드
  tags: [운영체제, 동시성]
  en: Thread
  def: 프로그램 안에서 일을 하나씩 맡아 처리하는 일꾼이에요. 서버는 보통 요청 하나에 스레드 하나를 붙여서 처리해요.

- id: 스레드 풀
  tags: [운영체제, 동시성, 백엔드]
  en: Thread Pool
  def: 스레드를 그때그때 만들지 않고 미리 정해진 개수만큼 만들어두고 돌려 쓰는 방식이에요. 다 쓰고 있으면 새 요청은 빈 스레드가 생길 때까지 기다려요.

- id: DB
  tags: [DB]
  en: Database
  def: 데이터를 저장하고 꺼내 쓰는 프로그램이에요. 좌석 상태, 회원 정보, 결제 기록 같은 게 여기 들어 있어요.

- id: DB 커넥션
  tags: [DB, 백엔드]
  en: DB Connection
  def: 서버가 DB와 대화하려고 열어두는 연결 통로예요. 연결을 새로 여는 데 시간이 걸려서 보통 미리 열어두고 돌려 써요.

- id: 커넥션 풀
  tags: [DB, 백엔드]
  en: Connection Pool
  def: DB 커넥션을 미리 정해진 개수만큼 열어두고 빌려 쓰는 방식이에요. 다 빌려가면 다음 요청은 반납될 때까지 기다려요.

- id: 타임아웃
  tags: [네트워크, 백엔드]
  en: Timeout
  def: 정해진 시간 안에 응답이 안 오면 기다리기를 포기하고 실패로 처리하는 것이에요. 무한정 기다리다 전체가 멈추는 걸 막아줘요.

- id: 경쟁 상태
  tags: [동시성]
  en: Race Condition
  def: 여러 작업이 같은 데이터를 거의 동시에 건드릴 때, 실행 순서에 따라 결과가 달라지는 문제예요. 같은 좌석이 두 명에게 팔리는 게 대표적이에요.

- id: 원자적
  tags: [동시성, DB]
  en: Atomic
  def: 여러 단계로 된 작업이 중간에 끼어들 틈 없이 "전부 되거나, 전부 안 되거나" 하나처럼 처리되는 성질이에요.

- id: 락
  tags: [동시성, DB]
  en: Lock
  def: 데이터를 쓰는 동안 다른 작업이 못 건드리게 잠가두는 장치예요. 화장실 문 잠금처럼, 쓰는 사람이 나가야 다음 사람이 들어가요.

- id: 트랜잭션
  tags: [DB]
  en: Transaction
  def: DB에서 여러 작업을 하나로 묶은 단위예요. 묶인 작업은 전부 성공하거나, 하나라도 실패하면 전부 취소돼요.

- id: 유니크 제약
  tags: [DB]
  en: Unique Constraint
  def: DB 테이블의 특정 값이 중복되지 못하게 거는 규칙이에요. 같은 좌석 번호로 예약이 두 번 들어오면 두 번째는 DB가 거부해요.

- id: 큐
  tags: [자료구조]
  en: Queue
  def: 먼저 들어온 것이 먼저 나가는(FIFO) 자료구조예요. 은행 번호표나 놀이공원 줄과 같아요.

- id: FIFO
  tags: [자료구조]
  en: First In, First Out
  def: 먼저 들어온 것이 먼저 나간다는 규칙이에요. 큐가 이 방식으로 동작해요.

- id: Redis
  tags: [DB, 인프라]
  en: Redis
  def: 데이터를 메모리에 저장해서 아주 빠르게 읽고 쓰는 DB예요. 대기열, 캐시, 선점 표시처럼 빨라야 하는 일에 많이 써요.

- id: 정렬된 집합
  tags: [자료구조, DB]
  en: Sorted Set
  def: Redis의 자료구조로, 값마다 점수를 붙여서 점수 순으로 정렬해 보관해요. 들어온 시각을 점수로 쓰면 그대로 대기 순번이 돼요.

- id: 캐시
  tags: [백엔드, 인프라]
  en: Cache
  def: 자주 쓰는 결과를 가까운 곳에 복사해두고 바로 꺼내 쓰는 방식이에요. 매번 DB까지 가지 않아도 돼서 빠르고 부담이 줄어요.

- id: CDN
  tags: [인프라, 프론트엔드]
  en: Content Delivery Network
  def: 이미지나 페이지 같은 파일을 전 세계 여러 서버에 복사해두고, 사용자와 가까운 곳에서 보내주는 서비스예요.

- id: 처리량
  tags: [서버, 인프라]
  en: Throughput
  def: 서버가 일정 시간 동안 처리할 수 있는 요청의 양이에요. 보통 "초당 몇 건"으로 말해요.

- id: 처리량 제한
  tags: [백엔드, 알고리즘]
  en: Rate Limiting
  def: 한 사용자나 IP가 일정 시간에 보낼 수 있는 요청 수를 제한하는 것이에요. 넘으면 바로 거절해요.

- id: 토큰 버킷
  tags: [알고리즘]
  en: Token Bucket
  def: 처리량 제한 알고리즘이에요. 통에 토큰이 일정 속도로 채워지고, 요청 하나가 토큰 하나를 써요. 토큰이 없으면 거절해요.

- id: HTTP 상태 코드
  tags: [네트워크, 프론트엔드, 백엔드]
  en: HTTP Status Code
  def: 서버가 응답에 붙이는 세 자리 숫자예요. 200은 성공, 404는 없음, 429는 요청이 너무 많음, 500대는 서버 오류예요.

- id: 지수 백오프
  tags: [알고리즘, 네트워크]
  en: Exponential Backoff
  def: 실패하면 바로 다시 시도하지 않고, 기다리는 시간을 1초, 2초, 4초처럼 두 배씩 늘려가며 재시도하는 방식이에요.

- id: 지터
  tags: [알고리즘]
  en: Jitter
  def: 재시도 대기 시간에 무작위 값을 섞는 것이에요. 모두가 정확히 같은 순간에 재시도해서 또 몰리는 걸 막아요.

- id: 스케일 아웃
  tags: [인프라]
  en: Scale Out
  def: 서버 대수를 늘려서 처리량을 키우는 방식이에요. 서버 한 대의 성능을 올리는 건 스케일 업이라고 해요.

- id: 오토스케일링
  tags: [인프라]
  en: Auto Scaling
  def: 부하를 보고 서버 대수를 자동으로 늘리거나 줄이는 기능이에요. 부하를 감지한 뒤에 서버를 띄우기 때문에 늘어나는 데 시간이 걸려요.

- id: 로드 밸런서
  tags: [인프라, 네트워크]
  en: Load Balancer
  def: 들어온 요청을 여러 서버에 골고루 나눠주는 장치예요. 서버를 늘려도 이게 있어야 요청이 나눠져요.

- id: TTL
  tags: [DB, 인프라]
  en: Time To Live
  def: 데이터가 자동으로 사라지기까지의 유효 시간이에요. "5분 동안만 좌석 선점"처럼 쓸 수 있어요.

- id: 낙관적 락
  tags: [DB, 동시성]
  en: Optimistic Lock
  def: 미리 잠그지 않고, 저장하는 순간에 "그사이 누가 바꿨는지"를 확인해서 바뀌었으면 실패시키는 방식이에요. 충돌이 드물 때 효율적이에요.
